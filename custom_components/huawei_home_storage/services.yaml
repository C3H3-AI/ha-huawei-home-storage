# 华为家庭存储服务定义（HA 界面里的中文名/说明/选择器）
#
# ⚠️ 文件空间有两个**独立**空间：category=user（「我的文件」）与
#    category=public（「共享」）。写操作默认落在 public（与客户端「共享」一致）。
# ⚠️ 删除类默认走**回收站**（可逆）；只有 permanent: true 才彻底删除。

# ---------------------------------------------------------------------------
# 设备 / 账号运维
# ---------------------------------------------------------------------------
refresh_credentials:
  name: 刷新设备凭据
  description: 强制重新申请设备会话凭据（设备报 401 或凭据过期时用）
  fields:
    entry_id:
      name: 配置条目 ID
      description: 留空则用第一个可用条目
      required: false
      example: "3f2b9c1e4d5a"
      selector:
        text:

duplicate_scan:
  name: 重复照片扫描
  description: 启动或停止重复照片扫描（不会删除照片）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    act:
      name: 动作
      required: true
      example: start
      selector:
        select:
          options: [start, stop]

reboot_device:
  name: 重启存储设备
  description: ⚠️ 会中断存储服务约 1-2 分钟（可恢复）。集成永不自动重启
  fields:
    confirm:
      required: true
      selector:
        text:
      description: >-
        不可逆操作的安全确认：必须完全等于 "REBOOT"（大小写敏感）才会执行。设备重启，服务中断约 1-2 分钟。
      example: "REBOOT"
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}

# --- 新增：关机（不可逆）---
shutdown_device:
  name: 关机
  description: ⚠️ 彻底关机设备（不可逆，需物理按键重启。逆向推断未实机验证）
  fields:
    confirm:
      required: true
      selector:
        text:
      description: >-
        不可逆操作的安全确认：必须完全等于 "SHUTDOWN"（大小写敏感）才会执行。设备彻底关机，需物理按键重启。
      example: "SHUTDOWN"
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}

# --- 新增：磁盘诊断 ---
disk_info:
  name: 磁盘诊断
  description: 查询磁盘基础状态 + SMART 健康（两个端点合在一个响应里。非 RAID 设备的 RAID 字段会返回 error）｜【实测】本机两个端点均返回 code=1，服务如实报 ok=False；设备可能未实现
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}

# --- 新增：RAID 状态 ---
raid_status:
  name: RAID 状态
  description: RAID 阵列状态。非 RAID 设备会返回 error（RAID 不是标配）｜【实测】本机返回 code=22（非 RAID 设备），符合"RAID 不是标配"的说明
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}


disk_sleep:
  name: 磁盘休眠
  description: 让设备磁盘进入休眠（可恢复，唤醒由设备策略决定）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}

usb_plug_out:
  name: 弹出 USB 设备
  description: ⚠️ 弹出设备上的 USB 存储（可恢复，但正在读写的文件会中断）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}

# ---------------------------------------------------------------------------
# 只读查询
# ---------------------------------------------------------------------------
query_files:
  name: 查询文件
  description: 列出最近/全部/指定目录/相册照片（只读）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    source:
      name: 数据源
      required: false
      example: recent
      selector:
        select:
          options: [recent, all, dir, photos]
    dir_path:
      name: 目录路径
      description: source=dir 时生效，需带尾斜杠
      required: false
      example: /file/
      selector: {text: {}}
    category:
      name: 空间
      description: user=我的文件，public=共享
      required: false
      selector:
        select:
          options: [user, public]
    limit:
      name: 条数上限
      required: false
      example: 20
      selector:
        number: {min: 1, max: 200}

file_detail:
  name: 文件详情
  description: 查询文件/目录详情（设备参数未完全解出，可能返回空）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    path:
      name: 路径
      required: true
      example: /file/测试/
      selector: {text: {}}
    category:
      name: 空间
      required: false
      selector:
        select:
          options: [user, public]

search_files:
  name: 搜索文件
  description: 按关键字搜索文件空间（参数由穷举实测得出：query + limit/offset）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    keyword:
      name: 关键字
      required: true
      selector: {text: {}}
    category:
      name: 空间
      required: false
      selector:
        select:
          options: [user, public]
    limit:
      name: 条数
      required: false
      default: 20
      selector: {number: {min: 1, max: 200}}
    offset:
      name: 偏移
      required: false
      default: 0
      selector: {number: {min: 0}}

task_status:
  name: 查询传输任务
  description: 查任务中心（filesvc=文件空间任务，trans=跨服务传输任务）｜【实测】可用
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    service:
      name: 任务来源
      required: false
      selector:
        select:
          options: [filesvc, trans, gallery]
    task_types:
      name: 任务类型
      description: 留空用抓包实据的整段（filesvc→400..408；trans→100..105,200..202；gallery→300..305）
      required: false
      selector: {text: {}}
    task_category:
      name: 任务分类
      required: false
      selector: {number: {min: 0, max: 99}}
    all_tasks:
      name: 取 trans 全表
      description: 走 /trans/getAllTask（不带 taskTypes 筛选）
      required: false
      default: false
      selector: {boolean: {}}

clean_task_records:
  name: 清除任务记录
  description: 清除任务中心的历史记录（只影响任务列表显示，不碰任何文件）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    task_ids:
      name: 任务 ID 列表
      description: 从 task_status 返回的 taskId
      required: true
      selector:
        text: {multiple: true}
    category:
      name: 空间
      required: false
      selector:
        select:
          options: [user, public]

list_albums:
  name: 列相册
  description: 列出相册。注意 album_type=0 不含 type=6（用户/共享相册），要全量请传 6
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    album_type:
      name: 相册类型
      description: 0=分类相册；6=用户/共享相册
      required: false
      default: 0
      selector: {number: {min: 0}}

add_album:
  name: 创建相册
  description: 新建相册（逆向推断实现，未实机验证）｜⚠️ 逆向推断未实机验证，且会**创建相册**（实测未执行，避免动设备数据）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    name:
      name: 相册名
      required: true
      selector: {text: {}}
    album_type:
      name: 相册类型
      required: false
      selector:
        number: {min: 0, max: 10}

del_album:
  name: 删除相册
  description: ⚠️ 删除相册（不可逆！逆向推断实现，未实机验证）｜⚠️ 逆向推断未实机验证，且会**删除相册**（实测未执行）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
