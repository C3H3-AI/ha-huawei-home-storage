      name: 偏移
      required: false
      selector: {number: {min: 0}}

# ---------------------------------------------------------------------------
# 文件空间写入（NAS 操作）
# ---------------------------------------------------------------------------
create_folder:
  name: 新建目录
  description: 在文件空间新建目录（可给 path 单个，或 paths 批多个；重名会报错而不是改名）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    path:
      name: 目录路径
      description: 单个目录，需带尾斜杠
      required: false
      example: /file/备份/
      selector: {text: {}}
    paths:
      name: 目录路径（批量）
      description: 与 path 二选一或同给；设备侧批量接口参数未解出，这里是逐个建
      required: false
      example: "['/file/备份/', '/file/归档/']"
      selector:
        text: {multiple: true}
    category:
      name: 空间
      required: false
      selector:
        select:
          options: [user, public]

rename_path:
  name: 重命名
  description: 重命名文件/目录（目录带尾斜杠，文件不带）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    old_path:
      name: 原路径
      required: true
      example: /file/备份/
      selector: {text: {}}
    new_path:
      name: 新路径
      required: true
      example: /file/备份_2026/
      selector: {text: {}}
    category:
      name: 空间
      required: false
      selector:
        select:
          options: [user, public]
    file_id:
      name: 条目 id
      description: 留空则自动列父目录解析（多一次请求）
      required: false
      selector: {text: {}}

move_paths:
  name: 移动文件/目录
  description: 把若干文件/目录移动到一个目标目录（异步任务）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    paths:
      name: 源路径
      description: 目录需带尾斜杠
      required: true
      example: "['/file/备份/']"
      selector:
        text: {multiple: true}
    dest_dir:
      name: 目标目录
      required: true
      example: /file/归档/
      selector: {text: {}}
    category:
      name: 源空间
      required: false
      selector:
        select:
          options: [user, public]
    dest_category:
      name: 目标空间
      required: false
      selector:
        select:
          options: [user, public]

copy_paths:
  name: 复制文件/目录
  description: 把若干文件/目录复制到一个目标目录（同空间，异步任务；目标目录需已存在）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    paths:
      name: 源路径
      description: 目录需带尾斜杠
      required: true
      example: "['/file/源目录/']"
      selector:
        text: {multiple: true}
    dest_dir:
      name: 目标目录
      required: true
      example: /file/目标目录/
      selector: {text: {}}
    category:
      name: 源空间
      required: false
      selector:
        select:
          options: [user, public]
    dest_category:
      name: 目标空间
      required: false
      selector:
        select:
          options: [user, public]

delete_paths:
  name: 删除文件/目录
  description: 删除文件空间的文件/目录 —— 默认移入回收站（可逆）；skip_recycle=true 永久删除（不可逆，逆向推导待实机验证）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    paths:
      name: 路径
      description: 目录需带尾斜杠
      required: true
      example: "['/file/临时/']"
      selector:
        text: {multiple: true}
    category:
      name: 空间
      required: false
      selector:
        select:
          options: [user, public]
    skip_recycle:
      name: 跳过回收站（永久删除）
      description: true=直接永久删除不进回收站（⚠️ 不可逆）
      required: false
      selector: {boolean: {}}

upload_file:
  name: 上传文件
  description: 把文本或 HA 主机上的文件上传到设备文件空间
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    dest_path:
      name: 目标路径
      required: true
      example: /file/备份/ha.txt
      selector: {text: {}}
    content:
      name: 文本内容
      description: 与 local_path 二选一（文本走这里）
      required: false
      selector: {text: {multiline: true}}
    local_path:
      name: 本地文件路径
      description: HA 主机上的路径（容器内常见可读路径为 /config 下）
      required: false
      example: /config/backup.tar
      selector: {text: {}}
    category:
      name: 空间
      required: false
      selector:
        select:
          options: [user, public]

download_file:
  name: 下载文件
  description: 从设备文件空间流式下载文件到 HA 主机（限写 uploads 目录）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    path:
      name: 设备路径
      required: true
      example: /file/备份/ha.txt
      selector: {text: {}}
    local_path:
      name: 本地目标路径
      description: HA 主机上的路径，限定在 /config/uploads 下（给目录时自动取设备路径的文件名）
      required: true
      example: /config/uploads/ha.txt
      selector: {text: {}}
    category:
      name: 空间
      required: false
      selector:
        select:
          options: [user, public]

cancel_upload:
  name: 取消上传
  description: 取消进行中的上传（需 prepareUpload 返回的 fileId）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    file_ids:
      name: fileId 列表
      required: true
      selector:
        text: {multiple: true}

copy_to_album:
  name: 复制到相册
  description: 把文件空间里的照片复制进相册（异步任务）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    paths:
      name: 源文件路径
      required: true
      selector:
        text: {multiple: true}
    album_id:
      name: 相册 ID
      required: true
      selector: {number: {min: 0}}
    album_name:
      name: 相册名称
      required: false
      selector: {text: {}}
    album_type:
      name: 相册类型
      description: 用户/共享相册为 6
      required: false
      default: 6
      selector: {number: {min: 0}}
    fids:
      name: 源文件 fid
      description: 与 paths 一一对应；留空则自动解析
      required: false
      selector:
        text: {multiple: true}
    category:
      name: 源空间
      required: false
      selector:
        select:
          options: [user, public]

recover_recycle:
  name: 回收站恢复
  description: 从回收站恢复条目（可直接给 rid，或给路径/名字自动匹配）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    rid:
      name: 回收站条目 rid
      required: false
      selector: {text: {}}
    name:
      name: 条目名
      required: false
      selector: {text: {}}
    paths:
      name: 路径
      required: false
      selector:
        text: {multiple: true}
    names:
      name: 名字列表
      required: false
      selector:
        text: {multiple: true}
    category:
      name: 空间
      required: false
      selector:
        select:
          options: [user, public]
    item_type:
      name: 条目类型
      description: 4=目录，0=文件（自动匹配时以回收站返回为准）
      required: false
      default: 4
      selector: {number: {min: 0, max: 8}}

permanent_delete_recycle_items:
  name: 永久删除回收站条目
  description: 把回收站里的条目永久删掉（⚠️ 不可逆！逆向推导待实机验证）｜⚠️ 不可逆：永久删除；需 confirm 确认（实测未执行）
  fields:
    confirm:
      required: true
      selector:
        text:
      description: >-
        不可逆操作的安全确认：必须完全等于 "PERMANENT_DELETE"（大小写敏感）才会执行。回收站条目永久删除。
      example: "PERMANENT_DELETE"
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    rids:
      name: 回收站 rid 列表
      description: 直接给 rid（数字或字符串），或用 paths/names 自动匹配
      required: false
      example: '[82, 123]'
      selector:
        text: {multiple: true}
    rid:
      name: 单个 rid
      required: false
      selector: {text: {}}
    paths:
      name: 路径
      description: 从回收站列表按路径匹配
      required: false
      selector:
        text: {multiple: true}
    names:
      name: 名字列表
      description: 从回收站列表按名字匹配
      required: false
      selector:
        text: {multiple: true}
    category:
      name: 空间
      required: false
      selector:
        select:
          options: [user, public]

empty_recycle:
  name: 清空回收站
  description: 一键清空整个回收站（⚠️ 所有条目永久消失！逆向推导待实机验证）｜⚠️ 不可逆：清空回收站；需 confirm 确认（实测未执行）
  fields:
    confirm:
      required: true
      selector:
        text:
      description: >-
        不可逆操作的安全确认：必须完全等于 "EMPTY_RECYCLE"（大小写敏感）才会执行。清空回收站，所有条目永久消失。
      example: "EMPTY_RECYCLE"
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    category:
      name: 空间
      required: false
      selector:
        select:
          options: [user, public]

# ---------------------------------------------------------------------------
# 相册（照片/视频）
# ---------------------------------------------------------------------------
delete_media:
  name: 移入回收站
  description: 把照片/视频移入回收站（可恢复，不会永久删除）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    file_ids:
      name: 媒体 fileId 列表
      required: true
      example: "281474976710690"
      selector: {text: {}}

recover_media:
  name: 恢复媒体
  description: 从回收站恢复照片/视频
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    file_ids:
      name: 媒体 fileId 列表
      required: true
      example: "281474976710690"
      selector: {text: {}}
